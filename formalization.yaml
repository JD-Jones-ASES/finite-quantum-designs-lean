    id: "https://arxiv.org/abs/1306.0978"
    type: "other"
    location: "PhD thesis, University of Waterloo, 2005 (arXiv:1306.0978): p. 28 (Theorem 3.3.1, the absolute bound, credited to Delsarte, Goethals and Seidel), p. 29 (Corollary 3.3.2, at most d^2 equiangular lines in C^d), p. 32 (Corollary 3.5.5, the relative bound for equiangular lines at an angle below 1/d), p. 36 (Corollary 3.5.15: for d^2 lines, equiangular and 2-design are equivalent), p. 83 (Corollary 6.0.4, the relative bound solved for the angle, one case of the Welch bound)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Corollary 3.3.2 is gerzon_bound and card_le_of_sicOverlapSq, by the linear independence of the rank-one
      projectors (the degree-1 case of the zonal-polynomial argument of Theorem 3.3.1), for every common squared
      overlap c != 1. Corollary 3.5.15 is the context of gerzon_equality and hasSICPOVM_iff_equiangular. Corollaries 3.5.5 and 6.0.4 are the equiangular cases of welch_card_bound and welch_bound_of_constantOverlap.
  - title: "Symmetric informationally complete quantum measurements"
    authors: ["Joseph M. Renes", "Robin Blume-Kohout", "A. J. Scott", "Carlton M. Caves"]
    id: "doi:10.1063/1.1737053"
    type: "paper"
    location: "Journal of Mathematical Physics 45 (2004), no. 6, 2171-2180; the text read is arXiv:quant-ph/0310075v1, pp. 1-8: p. 1 (eq. (1), the SIC definition; the known analytic solutions d = 2, 3, 8), p. 2 (eqs. (5)-(6), Theorem 1, the frame-potential bound of Benedetto and Fickus), pp. 2-3 (section II: a SIC is a tight frame, hence a POVM; the Gram matrix of its projectors is nonsingular, so they are linearly independent and the SIC is informationally complete; no expansion coefficients are given)"
    relationship: "formalizes"
