automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        statements and their fidelity check against the sources, the Lean proofs, the standard-library replay of
        every construction, the literature and prior-art searches, and the repository text; Claude Fable 5.1
        pinned the statements, merged the proof files and wrote the documents, Claude Opus 5.5 subagents wrote
        the proofs, the checkers and the audits. Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit
        065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest and lake update is never
        run; there are no GitHub Actions workflows. There is no native_decide. The proofs use Mathlib's additive
        characters (ZMod.stdAddChar, AddChar.FiniteField.primitiveChar_to_Complex, AddChar.sum_mulShift),
        GaloisField with its trace form (traceForm_nondegenerate), Kronecker products, linear independence in
        EuclideanSpace and in the matrix space, and decide +kernel over explicit integer tables in two leaves
        without Mathlib (the bases in dimensions 2, 4, 8 and the Hoggar overlaps).
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    The fourteen definitions are formal-conjectures' own, restated verbatim inside a noncomputable section as
    there; their CoeFun instance on StateVector is not restated since Mathlib's PiLp instance gives the same
    coordinates. The bound is stated for d >= 2 where Bandyopadhyay-Boykin-Roychowdhury-Vatan state it for every
    d; it fails at d = 0 and d = 1 in this encoding (every two bases of C^1 are unbiased), which hasMUBs_one_dim
    records. The tensor bound is stated for every k (including k = 0) and every m, n (including 0, where every
    family is vacuously unbiased); its corollary is stated over the factorization of d != 0 rather than for a
    single prime divisor (the single-prime form, HasMUBs d (q + 1) for every prime p dividing d, is not known to
    hold: for d = 6, p = 3 it would assert four mutually unbiased bases in C^6, an open question). The odd-characteristic statement is for any finite
    field F of odd characteristic, with Fintype.card F as the dimension; its proof uses Mathlib's primitive character
    (Klappenecker-Rötteler use the trace character), and quadSum_normSq holds for every nontrivial additive
    character; the quadratic-phase sum is proved by Weyl differencing, not by the Weil bound they cite. The 2^n bases are written over the vector space (Fin n -> ZMod 2)
    with a Z/4-valued quadratic form from the trace form of GaloisField 2 n in a chosen basis, equivalent to
    Klappenecker-Rötteler's Galois-ring bases up to the relabelling a -> a^2 of the bases and the order of columns
    (Godsil-Roy, section 6); the identity
    Q(x + y) = Q(x) + Q(y) + 2 x^T S y + 4 m is proved over the integers. Gerzon's bound is stated for every
    common squared overlap c != 1 (not only the SIC angle) and for every d and N (at N = 1 a normalized vector
    forces d >= 1; the case c > 1 is covered by the same argument); the equality case and the frame identity are
    stated for d >= 2 (at d = 1 the overlap condition is vacuous). The frame identity is stated as a matrix
    equation with Matrix.vecMulVec, (k, l) entry phi_k conj(phi_l), and the scalar (d : C)^{-1}. The
    dimension-2 and 3 SIC families are formal-conjectures' witness families restated with real parameters
    a, b, r (resp. s, r) satisfying a^2 = 1/3, b^2 = 2/3, s^2 = 1/2, r^2 = 3 and omega = -1/2 + (r/2) i; the
    dimension-8 family is the three-qubit Pauli orbit of (-1 + 2i, 1, ..., 1)/sqrt 12, which is Jedwab-Wiebe's
    Example 4 up to one sign per vector. In the two field statements F ranges over Type (universe 0); GaloisField p k lives in Type, so every prime
    power is covered.

acknowledgements: >-
  Ivanović, Wootters and Fields, Bandyopadhyay, Boykin, Roychowdhury and Vatan, Klappenecker and Rötteler, Delsarte,
  Goethals and Seidel, Renes, Blume-Kohout, Scott and Caves, Hoggar, Jedwab and Wiebe, Godsil and Roy, and Roy for
  the theorems and the constructions; the Formal Conjectures authors for the vocabulary and the XC0R fork for the
  lemmas adapted; Lean, Mathlib, Comparator, lean4export, NanoDa, and the Palomar policy and verifier projects. AI
  assistance is disclosed above.
review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents developed the
    proofs and audited them in separate passes; the statements were checked against the arXiv texts of
    Klappenecker-Rötteler, Bandyopadhyay-Boykin-Roychowdhury-Vatan, Renes-Blume-Kohout-Scott-Caves, Jedwab-Wiebe,
    Godsil-Roy and Roy's thesis (the pages named in the sources); Delsarte-Goethals-Seidel, Hoggar, Ivanović,
    Wootters-Fields and Zauner were not read. Every construction behind a compared statement (odd prime powers 3, 5, 7, 9, 11, 13, 25, 27; 2^n <= 16; the
    Hoggar vectors with their frame identity; the tetrahedron and the Hesse configuration) was recomputed outside
    Lean in exact arithmetic by scripts/check_designs.py and, before it, by a second replay written independently. Mechanical correctness and agreement of formal statements do
    not establish priority or significance.

alignment:
  namespace: "QuantumDesigns"
  statements:
    - source: "Bandyopadhyay-Boykin-Roychowdhury-Vatan 2002, Theorem 3.5"
      lean: "QuantumDesigns.hasMUBs_le"
      module: "Solution"
      status: "proved"
      note: "At most d + 1 mutually unbiased bases in dimension d >= 2 (the source states it for every d; the formal statement needs d >= 2, see hasMUBs_one_dim)."
    - source: "this development"
      lean: "QuantumDesigns.hasMUBs_one_dim"
      module: "Solution"
      status: "proved"
      note: "In dimension 1 every two bases are unbiased, so the hypothesis d >= 2 of the bound is necessary."
    - source: "this development"
      lean: "QuantumDesigns.hasMUBs_of_le"
      module: "Solution"
      status: "proved"
      note: "A subfamily of mutually unbiased bases is one."
    - source: "Klappenecker-Rötteler 2004, Lemma 3"
      lean: "QuantumDesigns.hasMUBs_mul"
      module: "Solution"
      status: "proved"
      note: "The tensor bound: Kronecker products of k unbiased bases of C^m and of C^n are k unbiased bases of C^(mn)."
    - source: "Klappenecker-Rötteler 2004, Lemma 3"
      lean: "QuantumDesigns.hasMUBs_of_forall_primePow"
      module: "Solution"
      status: "proved"
      note: "N(d) >= min over the exact prime-power divisors q of d of (q + 1), stated as HasMUBs d k for every k at most that minimum."
    - source: "Klappenecker-Rötteler 2004, remark after Lemma 3"
      lean: "QuantumDesigns.hasMUBs_three"
      module: "Solution"
      status: "proved"
      note: "N(d) >= 3 for every d >= 2."
    - source: "Klappenecker-Rötteler 2004, Lemma 1 (Weil sums), proved here by Weyl differencing"
      lean: "QuantumDesigns.quadSum_normSq"
      module: "Solution"
      status: "proved"
      note: "The squared norm of the quadratic-phase sum over an odd-characteristic finite field is the field's size, for c != 0."
    - source: "Klappenecker-Rötteler 2004, Theorem 2"
      lean: "QuantumDesigns.hasCompleteMUBs_of_odd_char"
      module: "Solution"
      status: "proved"
      note: "The standard basis and the q bases psi(a x^2 + b x)/sqrt q are q + 1 mutually unbiased bases of C^q, for any finite field of odd characteristic."
    - source: "Klappenecker-Rötteler 2004, Theorem 2, with Bandyopadhyay-Boykin-Roychowdhury-Vatan 2002, Theorem 3.5"
      lean: "QuantumDesigns.isMaxMUBCount_odd_prime_pow"
      module: "Solution"
      status: "proved"
      note: "mu(p^k) = p^k + 1 for odd p and k >= 1."
    - source: "Klappenecker-Rötteler 2004, Theorem 3 (an equivalent family in Z/4 trace-form coordinates)"
      lean: "QuantumDesigns.hasCompleteMUBs_two_pow"
      module: "Solution"
      status: "proved"
      note: "2^n + 1 mutually unbiased bases of C^(2^n) for n >= 1."
    - source: "Klappenecker-Rötteler 2004, Theorem 3, with Bandyopadhyay-Boykin-Roychowdhury-Vatan 2002, Theorem 3.5"
      lean: "QuantumDesigns.isMaxMUBCount_two_pow"
      module: "Solution"
      status: "proved"
      note: "mu(2^n) = 2^n + 1 for n >= 1."
    - source: "Klappenecker-Rötteler 2004, Theorems 2 and 3, with Bandyopadhyay-Boykin-Roychowdhury-Vatan 2002, Theorem 3.5"
      lean: "QuantumDesigns.isMaxMUBCount_prime_pow"
      module: "Solution"
      status: "proved"
      note: "mu(p^k) = p^k + 1 for every prime power."
    - source: "this development"
      lean: "QuantumDesigns.hasCompleteMUBs_iff_isMaxMUBCount"
      module: "Solution"
      status: "proved"
      note: "For d >= 2 a complete set exists iff d + 1 is the maximal number."
    - source: "formal-conjectures OpenQuantumProblems/13.lean, mutuallyUnbiasedBases_dim2 (re-proved by a kernel-checked table)"
      lean: "QuantumDesigns.isMaxMUBCount_two"
      module: "Solution"
      status: "proved"
      note: "mu(2) = 3."
    - source: "this development (a kernel-checked table)"
      lean: "QuantumDesigns.isMaxMUBCount_four"
      module: "Solution"
      status: "proved"
      note: "mu(4) = 5."
    - source: "this development (a kernel-checked table)"
      lean: "QuantumDesigns.isMaxMUBCount_eight"
      module: "Solution"
      status: "proved"
      note: "mu(8) = 9."
    - source: "Roy 2005, Corollary 3.3.2 (the absolute bound of Delsarte-Goethals-Seidel 1975)"
      lean: "QuantumDesigns.gerzon_bound"
      module: "Solution"
      status: "proved"
      note: "N unit vectors of C^d with one squared overlap c != 1 on every pair satisfy N <= d^2."
    - source: "this development"
      lean: "QuantumDesigns.gerzon_sharp"
      module: "Solution"
      status: "proved"
      note: "With c = 1 the family may be any length, so c != 1 is necessary."
    - source: "Roy 2005, Corollary 3.3.2 (the absolute bound of Delsarte-Goethals-Seidel 1975); Renes-Blume-Kohout-Scott-Caves 2004, section II"
      lean: "QuantumDesigns.gerzon_equality"
      module: "Solution"
      status: "proved"
      note: "For d >= 2, d^2 such vectors have c = 1/(d + 1)."
    - source: "Renes-Blume-Kohout-Scott-Caves 2004, section II"
      lean: "QuantumDesigns.gerzon_frame"
      module: "Solution"
      status: "proved"
      note: "For d >= 2, d^2 such vectors resolve the identity with weights 1/d."
    - source: "Renes-Blume-Kohout-Scott-Caves 2004, section II"
      lean: "QuantumDesigns.isSICFamily_frame"
      module: "Solution"
      status: "proved"
      note: "Every SIC family is a POVM."
    - source: "Roy 2005, Corollary 3.3.2 (the absolute bound of Delsarte-Goethals-Seidel 1975), Corollary 3.5.15 (context)"
      lean: "QuantumDesigns.hasSICPOVM_iff_equiangular"
      module: "Solution"
      status: "proved"
      note: "For d >= 2, HasSICPOVM d iff d^2 equiangular unit vectors exist."
    - source: "Roy 2005, Corollary 3.3.2 (the absolute bound of Delsarte-Goethals-Seidel 1975)"
      lean: "QuantumDesigns.card_le_of_sicOverlapSq"
      module: "Solution"
      status: "proved"
      note: "A family at the SIC angle has at most d^2 members."
    - source: "formal-conjectures OpenQuantumProblems/23.lean (the witness families)"
      lean: "QuantumDesigns.hasSICPOVM_two"
      module: "Solution"
      status: "proved"
      note: "The tetrahedral SIC-POVM of the qubit (formal-conjectures' hasSICPOVM_two, left with sorry there)."
    - source: "formal-conjectures OpenQuantumProblems/23.lean (the witness families)"
      lean: "QuantumDesigns.hasSICPOVM_three"
      module: "Solution"
      status: "proved"
      note: "The Hesse SIC-POVM of the qutrit (formal-conjectures' hasSICPOVM_three, left with sorry there)."
    - source: "Jedwab-Wiebe 2015, Example 4"
      lean: "QuantumDesigns.hasSICPOVM_eight"
      module: "Solution"
      status: "proved"
      note: "Hoggar's 64 lines as the three-qubit Pauli orbit of (-1 + 2i, 1, ..., 1)/sqrt 12, kernel-checked."
