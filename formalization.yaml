# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Finite quantum designs: at most d + 1 mutually unbiased bases for d >= 2 and exactly q + 1 in every prime-power dimension q, the tensor bound, Gerzon's bound N <= d^2 for complex equiangular lines with equality only at the SIC angle, and SIC-POVMs in dimensions 2, 3 and 8 (Hoggar's lines)"
  description: >-
    A Lean 4 development of two structures of finite-dimensional quantum information, in the vocabulary of
    google-deepmind/formal-conjectures (Open Quantum Problems 13 and 23; the fourteen definitions restated
    character for character under their Apache-2.0 license, see NOTICE). A basis of C^d is a unitary matrix
    whose columns are the basis vectors; two bases U, V are mutually unbiased when every entry of U^* V has
    squared norm 1/d; HasMUBs d k says k pairwise unbiased bases exist and IsMaxMUBCount d k that k is the
    largest such number. Theorems: for d >= 2, HasMUBs d m implies m <= d + 1 (Wootters-Fields 1989;
    Bandyopadhyay-Boykin-Roychowdhury-Vatan 2002, Theorem 3.5: the identity and the m(d - 1) traceless
    combinations of the rank-one projectors are pairwise orthogonal in the d^2-dimensional matrix space), and
    the hypothesis is sharp since in dimension 1 every two bases are unbiased; restriction to subfamilies; the
    tensor bound HasMUBs m k and HasMUBs n k imply HasMUBs (m n) k (Klappenecker-Rötteler 2004, Lemma 3) and its
    corollary over the factorization (HasMUBs d k whenever k <= q + 1 for every exact prime-power divisor q of
    d), hence three mutually unbiased bases in every dimension d >= 2; for a finite field F of odd
    characteristic and size q, the standard basis and the q bases with entries psi(a x^2 + b x)/sqrt q (psi a
    nontrivial additive character) are q + 1 mutually unbiased bases (Klappenecker-Rötteler, Theorem 2), through
    the identity |sum_x psi(c x^2 + e x)|^2 = q for c != 0 proved by Weyl differencing; for q = 2^n the bases with
    entries i^(x^T S_a x) (-1)^(b . x)/sqrt q, S_a the {0, 1}-lifted Gram matrix of the trace form (x, y) ->
    Tr(a x y) of the field with 2^n elements (an equivalent form of the Galois-ring bases of
    Klappenecker-Rötteler, Theorem 3), through the mod-4 identity Q(x + y) = Q(x) + Q(y) + 2 x^T S y and the
    nondegeneracy of the trace form; so IsMaxMUBCount (p^k) (p^k + 1) for every prime power, HasCompleteMUBs d
    iff IsMaxMUBCount d (d + 1) for d >= 2, and the values 3, 5, 9 in dimensions 2, 4, 8 also by explicit
    kernel-checked tables. A SIC family in C^d is d^2 unit vectors with pairwise squared overlap 1/(d + 1);
    HasSICPOVM d says one exists. Theorems: N unit vectors of C^d with one squared overlap c != 1 on every pair
    satisfy N <= d^2 (the absolute bound of Delsarte-Goethals-Seidel 1975, the complex form of Gerzon's bound;
    the rank-one projectors are linearly independent), and with c = 1 the family may be any length; for d >= 2,
    d^2 such vectors have c = 1/(d + 1) and resolve the identity, sum_i (1/d) |phi_i><phi_i| = 1, so every SIC
    family is a POVM (Renes-Blume-Kohout-Scott-Caves 2004), HasSICPOVM d holds iff C^d has d^2 equiangular unit
    vectors, and a family at the SIC angle has at most d^2 members; SIC-POVMs exist in dimensions 2 (the
    tetrahedron), 3 (the Hesse configuration) and 8 (Hoggar's 64 lines: the orbit of (-1 + 2i, 1, 1, 1, 1, 1,
    1, 1)/sqrt 12 under the three-qubit Pauli group, Jedwab-Wiebe 2015, Example 4, checked by the kernel over
    all ordered pairs). Twenty-six compared statements, kernel-only. As of 2026-10-10 no formalization of the
    general bound, of the prime-power constructions, of the factorization corollary or of the complex absolute
    bound with its equality case was located in the Palomar registry, Mathlib, formal-conjectures, openai/math,
    the other Lean repositories searched, the Isabelle AFP, the Rocq package index or arXiv; the dimension-2 MUB
    case is formal-conjectures' mutuallyUnbiasedBases_dim2, the dimension-6 projector bound and the Kronecker
    lemma are in the XC0R fork of formal-conjectures (adapted here, see NOTICE), the dimension-2 and 3 SIC
    overlaps are in zblore/csd-lean4, and the-omega-institute/trureturing kernel-checks the same 64 Hoggar
    vectors and the Hesse SIC in its own vocabulary. Not claimed: anything about dimension 6 (openai/math holds
    the bound of five bases in Lean), Weiner's completion gap, SICs in dimensions 4 to 7, any first formalization.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["quant-ph", "math.CO"]
  msc2020: ["81P15", "05B30", "52C35", "11T24"]

sources:
  - title: "Constructions of Mutually Unbiased Bases"
    authors: ["Andreas Klappenecker", "Martin Rötteler"]
    id: "doi:10.1007/978-3-540-24633-6_10"
    type: "paper"
    location: "Finite Fields and Applications (Fq7), Lecture Notes in Computer Science 2948, Springer, 2004, 137-144; the text read is arXiv:quant-ph/0309120v1: p. 2 (Lemma 1, Weil sums), p. 3 (Theorem 2, odd characteristic), p. 4 (Lemma 2; Theorem 3, the Galois-ring bases for 2^n), p. 6 (Lemma 3, N(d) >= the minimum of N(p_i^{a_i}) over the prime-power factors, N(nm) >= min{N(n), N(m)}, and the remark N(d) >= 3 for d >= 2)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 2 is hasCompleteMUBs_of_odd_char (the basis index on x^2, the column index on x), stated here for
      every finite field of odd characteristic and derived for every odd prime power through GaloisField; its
      Lemma 1 (the Weil sum) is quadSum_normSq, proved here by Weyl differencing instead of the cited Weil bound.
      Lemma 3 and its remarks are hasMUBs_mul, hasMUBs_of_forall_primePow and hasMUBs_three. The bases of
      hasCompleteMUBs_two_pow are those of Theorem 3 written over the vector space of the field with 2^n elements
      with a Z/4-valued quadratic form from the trace form, the same family up to the relabelling a -> a^2 of the
      bases and the order of each basis's columns (cf. Godsil-Roy 2009, section 6); the proof here is direct in those coordinates. The paper cites
      the d + 1 bound and does not prove it.
  - title: "A New Proof for the Existence of Mutually Unbiased Bases"
    authors: ["Somshubhro Bandyopadhyay", "P. Oscar Boykin", "Vwani Roychowdhury", "Farrokh Vatan"]
    id: "doi:10.1007/s00453-002-0980-7"
    type: "paper"
    location: "Algorithmica 34 (2002), no. 4, 512-528; the text read is arXiv:quant-ph/0103162v3: pp. 9-10 (Theorem 3.4), p. 11 (Theorem 3.5)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 3.5 (at most d + 1 bases) is hasMUBs_le, by the argument of Theorem 3.4: the identity and the
      m(d - 1) traceless unitaries diagonal in each basis are pairwise orthogonal in the d^2-dimensional matrix
      space. The source states Theorem 3.5 for every d; its last step divides by d - 1, and the statement fails
      at d = 1 (hasMUBs_one_dim), so the formal statement assumes d >= 2.
