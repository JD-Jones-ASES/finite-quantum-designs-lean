sources:
  - title: "Constructions of Mutually Unbiased Bases"
    authors: ["Andreas Klappenecker", "Martin Rötteler"]
    id: "doi:10.1007/978-3-540-24633-6_10"
    type: "paper"
    location: "Finite Fields and Applications (Fq7), Lecture Notes in Computer Science 2948, Springer, 2004, 137-144; the text read is arXiv:quant-ph/0309120v1: p. 2 (Lemma 1, Weil sums), p. 3 (Theorem 2, odd characteristic), p. 4 (Lemma 2; Theorem 3, the Galois-ring bases for 2^n), p. 6 (Lemma 3, N(d) >= the minimum of N(p_i^{a_i}) over the prime-power factors, N(nm) >= min{N(n), N(m)}, and the remark N(d) >= 3 for d >= 2)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 2 is hasCompleteMUBs_of_odd_char (the basis index on x^2, the column index on x), stated here for
      every finite field of odd characteristic and derived for every odd prime power through GaloisField; its
      Lemma 1 (the Weil sum) is quadSum_normSq, proved here by Weyl differencing instead of the cited Weil bound.
      Lemma 3 and its remarks are hasMUBs_mul, hasMUBs_of_forall_primePow and hasMUBs_three. The bases of
      hasCompleteMUBs_two_pow are those of Theorem 3 written over the vector space of the field with 2^n elements
      with a Z/4-valued quadratic form from the trace form, the same family up to the relabelling a -> a^2 of the
      bases and the order of each basis's columns (cf. Godsil-Roy 2009, section 6); the proof here is direct in those coordinates. The paper cites
      the d + 1 bound and does not prove it.
  - title: "A New Proof for the Existence of Mutually Unbiased Bases"
    authors: ["Somshubhro Bandyopadhyay", "P. Oscar Boykin", "Vwani Roychowdhury", "Farrokh Vatan"]
    id: "doi:10.1007/s00453-002-0980-7"
    type: "paper"
    location: "Algorithmica 34 (2002), no. 4, 512-528; the text read is arXiv:quant-ph/0103162v3: pp. 9-10 (Theorem 3.4), p. 11 (Theorem 3.5)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 3.5 (at most d + 1 bases) is hasMUBs_le, by the argument of Theorem 3.4: the identity and the
      m(d - 1) traceless unitaries diagonal in each basis are pairwise orthogonal in the d^2-dimensional matrix
      space. The source states Theorem 3.5 for every d; its last step divides by d - 1, and the statement fails
      at d = 1 (hasMUBs_one_dim), so the formal statement assumes d >= 2.
  - title: "A gap for the maximum number of mutually unbiased bases"
    authors: ["Mihály Weiner"]
    id: "doi:10.1090/S0002-9939-2013-11487-5"
    type: "paper"
    location: "Proceedings of the American Mathematical Society 141 (2013), no. 6, 1963-1969; read in full in the text arXiv:0902.0635v2 (16 Jul 2010), pages 1-6: p. 1 (abstract: at most d + 1 bases for d > 1, N(d) != d, and for d > 1 either N(d) = d + 1 or N(d) <= d - 1; eq. (1), the definition), p. 2 (the missing basis can only be the orthogonal complement of V), p. 3 (eq. (4), the pinching; eq. (6), the bound; Lemma 2.1, recalled from Werner 2001, and eq. (8)), p. 4 (section 3: V, B = V^perp, 1 in B, B self-adjoint; Lemma 3.1, citing Choi 1974, Corollary 2.8 and Theorem 3.1; Lemma 3.2 with eqs. (11)-(14)), p. 5 (Proposition 3.3 with eq. (15); Corollary 3.4), p. 6 (references)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Corollary 3.4 is exists_isMUBFamily_extension (the given d bases keep their places in the complete set)
      and, in its existence form, hasCompleteMUBs_of_hasMUBs_self, both stated here for every d (the corollary
      carries no hypothesis on d; the cases d <= 1 are trivial); hasCompleteMUBs_of_le_hasMUBs,
      isMaxMUBCount_ne_self, isMaxMUBCount_dichotomy (the abstract's N(d) != d and, for d > 1, N(d) = d + 1 or
      N(d) <= d - 1) and not_isMaxMUBCount_six_six are its corollaries. The proof follows the paper's route with
      its operator-algebra steps written out: Lemma 3.2's Kraus form of the projection E_B onto B = V^perp
      (gp_exists_kraus, over the Fourier orthonormal basis of each A_k intersected with the complement of 1;
      Lemma 2.1, the identity sum_k A_k^* X A_k = Tr(X) 1 for an orthonormal basis of M_d(C) that the paper
      recalls from Werner 2001, is gp_onb_sum); the Schwarz inequality that Lemma 3.1 takes from Choi 1974 is
      written as the sum-of-squares defect of the Kraus form (gp_schwarz_defect), so a fixed point of E_B
      commutes with the Kraus operators (gp_commute_of_fixed) in place of Choi's multiplicative-domain theorem,
      the same move as openai/math's commutator_trace_identity and commute_of_kraus_fixed; and in place of
      Proposition 3.3's double-commutant argument the Kraus operators, which lie in B and commute, are
      diagonalized in a common orthonormal eigenbasis whose rank-one projectors are fixed by E_B, hence lie in
      B, hence are unbiased to every basis of the family. The paper states the d + 1 bound (eq. (6)) for d > 1
      and does not prove it.
