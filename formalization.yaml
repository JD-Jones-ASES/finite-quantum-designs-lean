      this paper.
  - title: "Tight informationally complete quantum measurements"
    authors: ["A. J. Scott"]
    id: "doi:10.1088/0305-4470/39/43/009"
    type: "paper"
    location: "Journal of Physics A: Mathematical and General 39 (2006), no. 43, 13507-13530; the text read is arXiv:quant-ph/0604049v6: p. 2 (Definition 3, weighted t-designs), p. 3 (Theorem 4 and its proof, eq. (9): the expansion of every operator over the projectors of a weighted 2-design), p. 4 (its lower bound as a generalization of the Welch bound), p. 10 (eq. (56), the state-reconstruction formula of a tight rank-one IC-POVM), p. 11 (eq. (65): the d(d + 1) vectors of a complete set of mutually unbiased bases form a 2-design with uniform weight 1/(d(d + 1)), citing Ivanović and Wootters-Fields, with eq. (56) as its reconstruction formula)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Equation (9) with w = 1/d^2 on the d^2 vectors of a SIC family is sic_reconstruction, and with w = 1/(d(d
      + 1)) on the d(d + 1) vectors of a complete set (whose projectors sum to (d + 1) 1) it is
      mub_reconstruction, both for every matrix. The proofs here do not use the 2-design identity: the
      projectors of a SIC family are linearly independent, and those of a complete set with the identity span
      the matrix space (the family of the d + 1 bound), so each formula is checked on a spanning family.
  - title: "Lower bounds on the maximum cross correlation of signals (Corresp.)"
    authors: ["L. R. Welch"]
    id: "doi:10.1109/TIT.1974.1055219"
    type: "paper"
    location: "IEEE Transactions on Information Theory 20 (1974), no. 3, 397-399. Not read (closed access); the statement is taken from the restatements in Datta-Howard-Cochran, arXiv:0909.0206v2, p. 2 (eqs. (1) and (2), with k = 1), Mixon-Needham-Shonkwiler-Villar, arXiv:2112.02916v1, p. 2 (Proposition 1), and Roy's thesis, p. 83 (Corollary 6.0.4, one case of the Welch bound)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The Welch bound for k = 1, sum_{i,j} |<x_i, x_j>|^2 >= N^2/d for N unit vectors of C^d (eq. (2) of the
      restatement), is welch_bound; its corollary for the largest cross correlation (eq. (1), k = 1)
      is welch_bound_of_constantOverlap for a constant overlap; welch_card_bound and card_le_of_overlapSq_le_sic
      are its rearrangement for a bounded overlap. The proof here is the Cauchy-Schwarz inequality for the
      identity and the frame operator in the matrix space.
