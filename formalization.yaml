status:
  scope: >-
    Forty-six compared theorems over the fourteen definitions of Challenge.lean (formal-conjectures' UMat,
    relativeUnitary, IsUnbiased, IsMUBFamily, HasMUBs, HasCompleteMUBs, IsMaxMUBCount, StateVector, IsNormalized,
    overlapSq, HasConstantOverlapSq, sicOverlapSq, IsSICFamily, HasSICPOVM; none a hole). Mutually unbiased bases:
    the bound m <= d + 1 for d >= 2 and its sharpness in dimension 1; restriction; the tensor bound and its
    factorization corollary; two bases in every dimension and three in every dimension d >= 2; the quadratic-phase
    sum over an odd-characteristic finite field; complete sets over every finite field of odd characteristic, in
    every dimension 2^n with n >= 1, hence IsMaxMUBCount (p^k) (p^k + 1) for every prime power and for odd p and
    for p = 2 separately, and HasMUBs (p^k) m iff m <= p^k + 1; HasCompleteMUBs d iff IsMaxMUBCount d (d + 1) for
    d >= 2; mu(2) = 3, mu(4) = 5, mu(8) = 9; Weiner's gap (any d bases of C^d extend by one basis to d + 1, for
    every d, and the existence form) and its corollaries (k >= d bases complete; mu(d) != d for d >= 2, mu(6) !=
    6; mu(d) = d + 1 or mu(d) < d); mu(d) unique, existing and in [3, d + 1] for d >= 2, absent for d = 1;
    formal-conjectures' 3 <= mu(6) <= 7; a complete set determines every matrix. SIC-POVMs and equiangular lines:
    the complex absolute bound N <= d^2 for any common squared overlap c != 1 and its sharpness at c = 1; for d >=
    2 and N = d^2 the overlap is 1/(d + 1) and the rank-one projectors resolve the identity with weights 1/d;
    every SIC family is a POVM; HasSICPOVM d iff d^2 equiangular unit vectors exist (d >= 2); a family at the SIC
    angle has at most d^2 members; a SIC family determines every matrix; Welch's bound sum_{i,j} |<phi_i,
    phi_j>|^2 >= N^2/d, its constant-overlap form, the relative bound and N <= d^2 at or below the SIC angle;
    HasSICPOVM 2, 3, 4 and 8. Not claimed: anything about dimension 6 beyond 3 <= mu(6) <= 7 and mu(6) != 6, SICs
    in dimensions 5 to 7, any first. The intentional placeholders of Challenge.lean are excluded from proof counts; Solution.lean does
    not import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

